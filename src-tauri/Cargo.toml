[package]
name = "orca-tauri"
version = "0.1.0"
description = "An on-demand Tauri desktop shell for the Orca headless runtime"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "orca_tauri"
path = "src/lib.rs"

[[bin]]
name = "orca-tauri"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = [
  "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-notification", "dep:tauri-plugin-updater", "dep:open", "dep:tracing-subscriber",
  "dep:tracing-appender"
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
anyhow = "1"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
os_pipe = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
tracing = "0.1"
url = "2"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "zip"], optional = true }
open = { version = "5", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-appender = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes",
  "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
