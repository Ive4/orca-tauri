name: Check upstream Orca

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: check-upstream-core
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin published installer, matching Node and source inventory
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const current = JSON.parse(fs.readFileSync('core-version.json', 'utf8'));
            const {data: latest} = await github.rest.repos.getLatestRelease({owner:'stablyai', repo:'orca'});
            const tag = latest.tag_name;
            if (!/^v\d+\.\d+\.\d+$/.test(tag) || latest.draft || latest.prerelease) {
              throw new Error('The latest upstream release is not a supported stable version.');
            }
            const parts = s => s.slice(1).split('.').map(Number);
            const a = parts(tag), b = parts(current.version);
            const comparison = a.map((n,i) => n-b[i]).find(n => n !== 0) ?? 0;
            if (comparison <= 0) { core.info('No newer stable core to propose.'); return; }
            const installer = latest.assets.filter(x => x.name === 'orca-windows-setup.exe');
            if (installer.length !== 1 || !/^sha256:[a-f0-9]{64}$/.test(installer[0].digest ?? '')) {
              throw new Error('Upstream has no unique Windows installer with a published SHA256 digest.');
            }
            const {data: commit} = await github.rest.repos.getCommit({owner:'stablyai',repo:'orca',ref:tag});
            const hash = text => crypto.createHash('sha256').update(text).digest('hex');
            async function source(path) {
              const response = await fetch(`https://raw.githubusercontent.com/stablyai/orca/${commit.sha}/${path}`);
              if (!response.ok) throw new Error(`Missing pinned upstream source: ${path}`);
              const text = await response.text();
              if (text.length > 256000) throw new Error(`Unexpectedly large source: ${path}`);
              return text;
            }
            const artifactPath = 'src/shared/remote-runtime/orcad-distribution/orcad-artifacts.ts';
            const pinPath = 'src/shared/node-runtime/node-runtime-pin.ts';
            const [artifacts,pin,license] = await Promise.all([source(artifactPath),source(pinPath),source('LICENSE')]);
            const nodeVersion = /export const NODE_RUNTIME_PIN\s*:[^=]+=[\s\S]*?version:\s*'([0-9.]+)'/.exec(pin)?.[1];
            const nodeAsset = /'win32-x64':\s*\{\s*source:\s*'official',\s*archive:\s*'([^']+)',\s*archiveSha256:\s*'([a-f0-9]{64})',\s*executableSha256:\s*'([a-f0-9]{64})'/.exec(pin);
            if (!nodeVersion || !nodeAsset || nodeAsset[1] !== `node-v${nodeVersion}-win-x64.zip`) {
              throw new Error('The upstream Node pin syntax changed; update the parser after review.');
            }
            const proposed = {
              schema_version:1, version:tag, package_revision:'0.0.1', target:'x86_64-pc-windows-msvc', upstream_target:'win32-x64',
              validation:{status:'candidate-awaiting-windows-smoke',audited_on:new Date().toISOString().slice(0,10),
                note:'Automation pins source identity only. Review the Windows core smoke report before merging.'},
              upstream:{repository:'stablyai/orca',commit:commit.sha,asset:installer[0].name,sha256:installer[0].digest.slice(7)},
              node:{version:nodeVersion,archive:nodeAsset[1],archive_sha256:nodeAsset[2],executable_sha256:nodeAsset[3]},
              source_sha256:{[artifactPath]:hash(artifacts),[pinPath]:hash(pin),LICENSE:hash(license)}
            };
            const {owner,repo} = context.repo;
            const {data: repository} = await github.rest.repos.get({owner,repo});
            const base = repository.default_branch;
            const branch = `automation/orca-core-${tag}`;
            const content = JSON.stringify(proposed,null,2)+'\n';
            let exists = true;
            try { await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`}); }
            catch(error) { if(error.status!==404) throw error; exists=false; }
            if (!exists) {
              const {data: baseRef} = await github.rest.git.getRef({owner,repo,ref:`heads/${base}`});
              await github.rest.git.createRef({owner,repo,ref:`refs/heads/${branch}`,sha:baseRef.object.sha});
              const {data: old} = await github.rest.repos.getContent({owner,repo,path:'core-version.json',ref:branch});
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'core-version.json',branch,
                sha:old.sha,message:`chore(core): propose Orca ${tag}`,content:Buffer.from(content).toString('base64')});
            } else {
              // Preserve human edits on an existing upgrade branch; never force-push it.
              const {data: old} = await github.rest.repos.getContent({owner,repo,path:'core-version.json',ref:branch});
              const existing = JSON.parse(Buffer.from(old.content,'base64').toString('utf8'));
              if(existing.version!==tag || existing.upstream.commit!==commit.sha || existing.upstream.sha256!==proposed.upstream.sha256) {
                throw new Error('Existing upgrade branch differs from the proposed upstream identity; leaving it untouched.');
              }
            }
            const {data: prs} = await github.rest.pulls.list({owner,repo,state:'open',head:`${owner}:${branch}`,base});
            const body = [
              `Pins [Orca ${tag}](${latest.html_url}) at commit \`${commit.sha}\`.`,
              '',
              'The lock includes the official Windows installer digest, the matching Node archive/executable digests, and the upstream artifact inventory digest.',
              '',
              'This PR does not certify WebView2 feature compatibility. The core workflow must pass plain-Node module loading, a real ConPTY spawn, readiness identity, terminal health, browser HTML, and Job cleanup before merge. Review the Windows 11 manual acceptance steps in docs/upstream-compatibility.md.',
              '',
              'A separate workflow_dispatch is sent because pull requests created with GITHUB_TOKEN do not automatically trigger pull_request workflows.'
            ].join('\n');
            const pr = prs[0] ?? (await github.rest.pulls.create({owner,repo,head:branch,base,title:`chore(core): qualify Orca ${tag}`,body})).data;
            // workflow_dispatch is an explicit GITHUB_TOKEN recursion exception.
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'release-core.yml',ref:branch,inputs:{publish:'false'}});
            await core.summary.addHeading('Orca core candidate').addLink(pr.title,pr.html_url)
              .addRaw('\n\nWindows qualification was dispatched on the candidate branch. No release was published.').write();
